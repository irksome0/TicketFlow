services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-ticketflow}}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-ticketflow}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-ticketflow_local_password}}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ticketflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./ticketflow-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${WEB_PORT:-3000}}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-ticketflow}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-ticketflow_local_password}}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-ticketflow}}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      DB_TIMEZONE: ${DB_TIMEZONE:-UTC}
      JWT_SECRET: ${JWT_SECRET:-local-development-ticketflow-secret-change-before-deploy}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      DB_RLS_ENABLED: ${DB_RLS_ENABLED:-true}
      ATTACHMENT_SCAN_ENABLED: ${ATTACHMENT_SCAN_ENABLED:-true}
      SLA_TIMEZONE: ${SLA_TIMEZONE:-Europe/Kyiv}
      SLA_BUSINESS_START: ${SLA_BUSINESS_START:-09:00}
      SLA_BUSINESS_END: ${SLA_BUSINESS_END:-18:00}
      SLA_HOLIDAYS: ${SLA_HOLIDAYS:-}
      SLA_HIGH_HOURS: ${SLA_HIGH_HOURS:-8}
      SLA_MEDIUM_HOURS: ${SLA_MEDIUM_HOURS:-24}
      SLA_LOW_HOURS: ${SLA_LOW_HOURS:-72}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-uploads}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./ticketflow-api/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./ticketflow-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8080}/api/v1}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8080}/api/v1}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ticketflow_postgres_data:
